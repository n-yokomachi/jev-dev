<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jev-dev affectus</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <span class="picks">
    <label class="tag" for="persona">人格</label>
    <select id="persona" title="返答生成に与える人格。両側とも同じ人格を使うので、違うのは判定器だけです">
      <option value="friendly">friendly（明るく協力的）</option>
      <option value="contrarian">contrarian（天邪鬼）</option>
    </select>
  </span>
  <span class="transport">
    <button id="reset" title="両側の感情状態を初期値に戻します">reset</button>
  </span>
</header>

<div class="notice" id="notice" hidden></div>

<main class="cols">
  <section class="panel llm" id="panel-llm">
    <div class="badge"><span class="n">LLM</span><span class="v" id="llm-model">—</span></div>
    <select id="llm-pick" class="pick"></select>
    <span class="lb">感情状態（affectus に蓄積）</span>
    <div class="wheel" id="wheel-llm"></div>
    <span class="lb">判定</span>
    <div class="ms" id="llm-ms">—<span>ms</span></div>
    <div class="track"><i id="llm-track"></i></div>
    <div class="meta"><span id="llm-tok">— tok</span><span id="llm-cost">—</span></div>
    <span class="lb gen-lb">生成</span>
    <div class="ms gen" id="llm-gen-ms">—<span>ms</span></div>
    <p class="reply empty" id="llm-reply">—</p>
    <div class="raw">
      <span class="lb raw-lb">判定の入出力（JSON）</span>
      <span class="lb io-lb">モデルに渡した内容</span>
      <pre class="io" id="llm-raw-req">—</pre>
      <span class="lb io-lb">返ってきた内容</span>
      <pre class="io" id="llm-raw-res">—</pre>
    </div>
  </section>

  <section class="panel mid">
    <form class="compose" id="compose">
      <label class="who" for="turn-user">user</label>
      <textarea id="turn-user" rows="5"
        placeholder="user の発言を書いて送信する。感情の蓄積は送信のたびに両側へ積まれる"></textarea>
      <button type="submit" id="send">メッセージを送信</button>
    </form>
    <div class="duel">
      <span class="lb">判定の対比（中央が 0、左右の末端が 1.0）</span>
      <div class="duel-head">
        <span class="llm">LLM</span>
        <span class="d">差</span>
        <span class="jev">jev</span>
      </div>
      <div class="duel-rows" id="duel"></div>
      <div class="diverge">判定のずれ（8軸の差の合計）<br><b id="l1">—</b></div>
    </div>
  </section>

  <section class="panel jev" id="panel-jev">
    <div class="badge"><span class="n">jev</span><span class="v" id="jev-model">—</span></div>
    <span class="lb">感情状態（affectus に蓄積）</span>
    <div class="wheel" id="wheel-jev"></div>
    <span class="lb">判定</span>
    <div class="ms" id="jev-ms">—<span>ms</span></div>
    <div class="track"><i id="jev-track"></i></div>
    <div class="meta"><span id="jev-tok">— tok</span><span id="jev-cost">—</span></div>
    <span class="lb gen-lb">生成</span>
    <div class="ms gen" id="jev-gen-ms">—<span>ms</span></div>
    <p class="reply empty" id="jev-reply">—</p>
    <div class="raw">
      <span class="lb raw-lb">判定の入出力（JSON）</span>
      <span class="lb io-lb">モデルに渡した内容</span>
      <pre class="io" id="jev-raw-req">—</pre>
      <span class="lb io-lb">返ってきた内容</span>
      <pre class="io" id="jev-raw-res">—</pre>
    </div>
  </section>
</main>

<script src="/app.js" type="module"></script>
</body>
</html>
